#   VERCEL_PROJECT_ID     — prj_xZmrAjHZjKncFudRykf1hDaLVvtB
name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security version check
        run: npx --yes fix-react2shell-next
      - name: Production build
        run: pnpm run build

